<svg xmlns="http://www.w3.org/2000/svg" width="960" height="316" viewBox="0 0 960 316" role="img" aria-labelledby="title desc">
<title id="title">Figure 1. The implemented boundary from response to decision</title>
<desc id="desc">The published evaluation uses authored responses and packets. The optional live adapter exists but supplied no measured data for this paper. Policy review and source authenticity are inputs to this path, not conclusions of it. [12, 13, 15]</desc>
